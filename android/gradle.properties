org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Windows host with little free RAM: compile Kotlin in the Gradle process instead of a second daemon.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# This port lives under a non-ASCII project path (the user's workspace); AGP only warns about it.
android.overridePathCheck=true
